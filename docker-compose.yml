
services:

  java-app:

    image: docker.io/shubhamtalvekar/java-maven-app:${IMAGE_TAG:-latest}

    container_name: java-app

    ports:
      - "8082:8080"

    environment:
      DB_URL: "jdbc:mysql://shopkart-db:3306/shopkart?allowPublicKeyRetrieval=true&useSSL=false"
      DB_USER: shopkart
      DB_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"

    depends_on:
      shopkart-db:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - shopkart-network


  shopkart-db:

    image: docker.io/library/mysql:8.4

    container_name: shopkart-db

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: shopkart
      MYSQL_USER: shopkart
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"

    volumes:
      - shopkart-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 --silent
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

    restart: unless-stopped

    networks:
      - shopkart-network


networks:

  shopkart-network:
    driver: bridge


volumes:

  shopkart-data:
